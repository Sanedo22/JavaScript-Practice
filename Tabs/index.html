<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="tab active" data-tab="1">Tab 1</button>
        <button class="tab" data-tab="2">Tab 2</button>
        <button class="tab" data-tab="3">Tab 3</button>
        <button class="tab" data-tab="4">Tab 4</button>
    </header>
    <main>
        <div class="content active" data-content="1">
            <p>Content for Tab 1</p>
        </div>
        <div class="content" data-content="2">
            <p>Content for Tab 2</p>
        </div>
        <div class="content" data-content="3">
            <p>Content for Tab 3</p>
        </div>
        <div class="content" data-content="4">
            <p>Content for Tab 4</p>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
